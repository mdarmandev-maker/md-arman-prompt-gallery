name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Update and Install Dependencies
        run: |
          sudo apt-get update -y
          # libtinfo5 hata diya hai kyunki ye naye Ubuntu mein nahi hota
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake
          
      - name: Install Buildozer
        run: |
          pip3 install --user --upgrade buildozer
          pip3 install --user cython
          
      - name: Build APK
        run: |
          export PATH=$PATH:$HOME/.local/bin
          buildozer -v android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Prompt-Gallery-APK
          path: bin/*.apk
