name: Build AI Prompt Gallery

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'  # or specify a specific version like '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer

      - name: Run Buildozer build
        run: |
          # Initialize buildozer and start the build
          buildozer android debug
          
        env:
          # Set environment variables if needed
          ANDROIDSDK: /path/to/android/sdk
          ANDROIDNDK: /path/to/android/ndk
